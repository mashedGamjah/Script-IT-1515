<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Treasure Hunt</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(5, 50px);
            gap: 5px;
        }

        .cell {
            width: 50px;
            height: 50px;
            background: lightgray;
            display: grid;
            place-items: center;
            font-size: 24px;
        }

        button {
            padding: 10px 15px;
            margin: 3px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Treasure Hunt</h1>

    <p>Find the hidden treasure in 10 moves or less!</p>

    <div id="grid"></div>

    <p>Moves: <span id="moves">0</span> / 10</p>

    <div>
    <button class="dir-btn" onclick="move('up')">↑</button>
    <button class="dir-btn" onclick="move('down')">↓</button>
    <button class="dir-btn" onclick="move('left')">←</button>
    <button class="dir-btn" onclick="move('right')">→</button>
</div>

    <p id="message"></p>

    <button onclick="resetGame()">Restart Game</button>

    <script>
        function draw(player) {
            const grid = document.querySelector("#grid");
            grid.innerHTML = "";

            for (let y = 0; y < 5; y++) {
                for (let x = 0; x < 5; x++) {
                    const cell = document.createElement("div");
                    cell.className = "cell";

                    if (player[0] === x && player[1] === y) {
                        cell.textContent = "🙂";
                    }

                    grid.appendChild(cell);
                }
            }
        }

        function updateGame(data) {
            draw(data.player);

            document.querySelector("#moves").textContent = data.moves;

            const message = document.querySelector("#message");

            if (data.found) {
                message.textContent = "🎉 You found the treasure!";
            } else if (data.game_over) {
                message.textContent = "💀 Game over! You ran out of moves.";
            } else {
                message.textContent = "";
            }
        }

        async function move(direction) {
            const response = await fetch(`/move?direction=${direction}`);
            const data = await response.json();

            updateGame(data);
        }

        async function resetGame() {
            const response = await fetch("/reset");
            const data = await response.json();

            updateGame(data);
        }

        draw([0, 0]);
    </script>
</body>
</html>
